# =============================================================================
# SOMAKID AI Engine - Docker Compose Configuration
# Orchestrates the AI engine, Redis cache, and PostgreSQL database
# =============================================================================

version: "3.9"

# =============================================================================
# Services
# =============================================================================
services:

  # ---------------------------------------------------------------------------
  # SOMAKID AI Engine - Core Application
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: somakid-ai-engine:latest
    container_name: somakid-api
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      # Environment
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      
      # Server
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=${WORKERS:-4}
      
      # Google Gemini AI
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash-lite}
      - GEMINI_MAX_TOKENS=${GEMINI_MAX_TOKENS:-2048}
      - GEMINI_TEMPERATURE=${GEMINI_TEMPERATURE:-0.4}
      
      # Redis
      - REDIS_URL=redis://redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      
      # Database
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-somakid}:${POSTGRES_PASSWORD:-somakid_secret}@postgres:5432/${POSTGRES_DB:-somakid_db}
      
      # Security
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production-min-32-chars}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_EXPIRATION_MINUTES=${JWT_EXPIRATION_MINUTES:-1440}
      
      # Rate Limiting
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-100}
      - RATE_LIMIT_PERIOD=${RATE_LIMIT_PERIOD:-60}
      
      # Languages
      - SUPPORTED_LANGUAGES=${SUPPORTED_LANGUAGES:-fr,ln,sw}
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-fr}
      
      # Business Limits
      - MAX_IMAGE_SIZE_MB=${MAX_IMAGE_SIZE_MB:-10}
      - MAX_QUIZ_QUESTIONS_PER_SESSION=${MAX_QUIZ_QUESTIONS_PER_SESSION:-20}
      - MAX_CHAT_HISTORY=${MAX_CHAT_HISTORY:-20}
    volumes:
      # Persist session data
      - ai_memory_data:/app/data/memory
      - ai_knowledge_data:/app/data/knowledge
    networks:
      - somakid-network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Redis - Cache and Session Store
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: somakid-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis_data:/data
    networks:
      - somakid-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  # ---------------------------------------------------------------------------
  # PostgreSQL - Primary Database (Optional for Full Functionality)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: somakid-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-somakid}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-somakid_secret}
      - POSTGRES_DB=${POSTGRES_DB:-somakid_db}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - somakid-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-somakid} -d ${POSTGRES_DB:-somakid_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  # ---------------------------------------------------------------------------
  # Optional: Prometheus for Metrics Collection
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: somakid-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - somakid-network
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    profiles:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ---------------------------------------------------------------------------
  # Optional: Grafana for Dashboards
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: somakid-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - somakid-network
    depends_on:
      - prometheus
    profiles:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

# =============================================================================
# Volumes
# =============================================================================
volumes:
  ai_memory_data:
    name: somakid_memory_data
    driver: local
  ai_knowledge_data:
    name: somakid_knowledge_data
    driver: local
  redis_data:
    name: somakid_redis_data
    driver: local
  postgres_data:
    name: somakid_postgres_data
    driver: local
  prometheus_data:
    name: somakid_prometheus_data
    driver: local
  grafana_data:
    name: somakid_grafana_data
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  somakid-network:
    name: somakid_network
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16